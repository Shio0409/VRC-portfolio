<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kipfel · Local avatar inspection</title>
  <link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/avatar/viewer.css">
  <script type="importmap">{"imports":{"three":"/avatar/vendor/build/three.module.js","three/addons/":"/avatar/vendor/examples/jsm/"}}</script>
  <script type="module" src="/avatar/viewer.js"></script>
</head>
<body>
  <div id="rotation" tabindex="-1" hidden>端末を横向きにしてください。<small>アバター確認ビューアー</small></div>
  <main id="shell">
    <section id="stage" aria-label="3Dアバター"><canvas id="canvas" aria-label="ドラッグで回転、ピンチまたはホイールで拡大" tabindex="0"></canvas><p id="status" role="status">モデルを読み込み中…</p></section>
    <aside>
      <small>LOCAL INSPECTION · THREE.JS</small><h1>Kipfel</h1><p>元のポーズを表示。変更はこの画面内だけに適用します。</p>
      <fieldset disabled id="controls">
        <legend>表示と変形の確認</legend>
        <div class="views"><button data-view="0">正面</button><button data-view="1.570796">側面</button><button data-view="3.141593">背面</button></div>
        <label>マテリアル<select id="material"><option value="pbr">PBR（変換結果）</option><option value="unlit">Unlit（色を確認）</option></select></label>
        <label class="check"><input type="checkbox" id="skeleton">骨を表示</label>
        <label>補助環境光 <output id="ambient-value">1.5</output><input id="ambient" type="range" min="0" max="4" step="0.1" value="1.5"></label>
        <label class="check"><input type="checkbox" id="vertex-colors">頂点カラーを乗算して比較</label>
        <label>表情 / Shape Key<select id="morph"><option value="">元の状態</option></select></label>
        <label>表情の強さ <output id="weight-value">0</output><input id="weight" type="range" min="0" max="1" step="0.01" value="0"></label>
        <label>骨<select id="bone"><option value="">選択なし</option></select></label>
        <label>ローカルX軸の回転 <output id="angle-value">0°</output><input id="angle" type="range" min="-30" max="30" step="1" value="0"></label>
        <button id="reset">ポーズ・表情を戻す</button>
      </fieldset>
      <p id="stats"></p><p class="note">lilToon・PhysBone・VRChat機能の再現は未実装。ギターの有無とTOPのポーズは未確定です。</p>
    </aside>
  </main>
</body></html>
